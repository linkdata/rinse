name: Verify Go builds

on: pull_request

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true

      - name: Generate
        run: go generate ./...

      - name: Test and vet
        run: |
          go test -race ./...
          go vet ./...

      - name: Build
        run: |
          CGO_ENABLED=0 go build ./...
          CGO_ENABLED=0 go build -tags devel ./...

      - name: Scan
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          gosec -exclude=G120,G703,G704,G705,G706 ./...

      - name: Build gVisor
        working-directory: gvisor
        run: |
          go get gvisor.dev/gvisor/runsc@go
          CGO_ENABLED=0 go build gvisor.dev/gvisor/runsc
